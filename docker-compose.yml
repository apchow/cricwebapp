services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pundit
      POSTGRES_PASSWORD: pundit
      POSTGRES_DB: pavilion_xi
    ports:
      - "5432:5432"
    volumes:
      - pavilion-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pavilion-pgdata:
